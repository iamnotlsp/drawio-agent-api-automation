name: API Regression on Self-hosted Runner

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - docs/**

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: api-regression-self-hosted
  cancel-in-progress: false

jobs:
  regression:
    name: Run pytest and publish Allure
    outputs:
      report_ready: ${{ steps.publish_report.outputs.ready }}
    runs-on:
      - self-hosted
      - Windows
      - X64
      - drawio-api
    timeout-minutes: 40
    env:
      DRAWIO_AGENT_PROJECT_DIR: E:/javaProject/DrawIOAgent
      GROUP_BUY_MARKET_PROJECT_DIR: E:/javaProject/group-buy-market
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean previous test artifacts
        shell: powershell
        run: |
          Remove-Item -Recurse -Force `
            "allure-results", "docs" `
            -ErrorAction SilentlyContinue

      - name: Validate local build environment
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DASHSCOPE_API_KEY)) {
            throw "GitHub Secret DASHSCOPE_API_KEY is not configured."
          }

          $requiredPaths = @(
            "$env:DRAWIO_AGENT_PROJECT_DIR/pom.xml",
            "$env:GROUP_BUY_MARKET_PROJECT_DIR/pom.xml"
          )
          foreach ($path in $requiredPaths) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required project file not found: $path"
            }
          }

          docker version
          docker compose version
          mvn --version

      - name: Build Java applications
        shell: powershell
        run: |
          mvn -f "$env:DRAWIO_AGENT_PROJECT_DIR/pom.xml" `
            clean package -DskipTests
          if ($LASTEXITCODE -ne 0) {
            throw "DrawIOAgent Maven build failed."
          }

          mvn -f "$env:GROUP_BUY_MARKET_PROJECT_DIR/pom.xml" `
            clean package -DskipTests
          if ($LASTEXITCODE -ne 0) {
            throw "group-buy-market Maven build failed."
          }

      - name: Start isolated Docker test environment
        shell: powershell
        run: |
          docker compose -f docker-compose.test.yml `
            down -v --remove-orphans
          docker compose -f docker-compose.test.yml `
            up -d --build

      - name: Wait for business APIs
        shell: powershell
        run: |
          function Wait-Api {
            param(
              [string]$Name,
              [scriptblock]$Probe,
              [int]$Attempts = 60
            )

            for ($attempt = 1; $attempt -le $Attempts; $attempt++) {
              try {
                & $Probe
                Write-Host "$Name is ready."
                return
              }
              catch {
                if ($attempt -eq $Attempts) {
                  docker compose -f docker-compose.test.yml ps -a
                  throw "$Name did not become ready."
                }
                Start-Sleep -Seconds 2
              }
            }
          }

          Wait-Api "DrawIOAgent" {
            $response = Invoke-WebRequest `
              -Uri "http://127.0.0.1:18091/api/v1/query_ai_agent_config_list" `
              -TimeoutSec 3 `
              -UseBasicParsing
            if ($response.StatusCode -ne 200) { throw "Not ready" }
          }

          Wait-Api "group-buy-market" {
            $body = @{
              userId = "github-actions-health"
              source = "s01"
              channel = "c01"
              goodsId = "9890002"
            } | ConvertTo-Json
            $response = Invoke-WebRequest `
              -Uri "http://127.0.0.1:18092/api/v1/gbm/index/query_group_buy_market_config" `
              -Method Post `
              -ContentType "application/json" `
              -Body $body `
              -TimeoutSec 3 `
              -UseBasicParsing
            if ($response.StatusCode -ne 200) { throw "Not ready" }
          }

      - name: Run pytest and generate Allure report
        shell: powershell
        run: |
          $pythonExecutable = "C:\Users\11600\.conda\envs\DrawIOAgentApiTest\python.exe"
          $allureExecutable = "C:\Users\11600\AppData\Roaming\npm\allure.ps1"

          if (-not (Test-Path -LiteralPath $pythonExecutable)) {
            throw "Python executable not found: $pythonExecutable"
          }
          if (-not (Test-Path -LiteralPath $allureExecutable)) {
            throw "Allure executable not found: $allureExecutable"
          }

          & .\scripts\run_allure.ps1 `
            -BaseUrl "http://127.0.0.1:18091" `
            -GroupBuyBaseUrl "http://127.0.0.1:18092" `
            -DrawioCallbackBaseUrl "http://drawio-agent:8091" `
            -PythonExecutable $pythonExecutable `
            -AllureExecutable $allureExecutable

      - name: Stop Docker test environment
        if: always()
        shell: powershell
        run: |
          docker compose -f docker-compose.test.yml `
            down -v --remove-orphans

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_number }}
          path: allure-results
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_number }}
          path: docs
          if-no-files-found: warn
          retention-days: 14

      - name: Commit latest report
        id: publish_report
        if: always() && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          if (-not (Test-Path -LiteralPath "docs\index.html")) {
            "ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "No generated report to publish."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all docs

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            "ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Allure report has no changes."
            exit 0
          }

          git commit -m "report: update Allure from run $env:GITHUB_RUN_NUMBER"
          git push origin HEAD:main
          "ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  deploy:
    name: Deploy Allure to GitHub Pages
    needs: regression
    if: always() && needs.regression.outputs.report_ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout latest report
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Allure report
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
